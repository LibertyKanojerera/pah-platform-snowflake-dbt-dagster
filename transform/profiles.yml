# Committed on purpose: no secrets live here. dbt runs from the repo root, so
# paths are relative to it. Anything machine-specific comes from env vars.
pah:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      # The warehouse has its own file, separate from the ingest state file:
      # DuckDB allows one writer per file, so dbt and the CLI never share one.
      path: "{{ env_var('DBT_DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      schema: dev
      threads: 4
      # UTC, so a date cast never depends on the machine's time zone
      settings:
        TimeZone: UTC
      extensions: [httpfs, aws]
      secrets:
        - type: s3
          provider: credential_chain
          # Environment first (CI, Dagster), then the SSO profile (local).
          # DuckDB resolves both itself; nothing is exported into the shell.
          chain: "env;sso"
          profile: "{{ env_var('AWS_PROFILE', 'pah-admin') }}"
          region: us-east-1
          # Parsing and linting must work without a live AWS session. Only
          # queries that touch S3 need credentials.
          validation: none
