version: 2

models:
  - name: int_drugs__route_resolved
    description: >
      One row per drug, meaning each (generic, brand) pair CMS reports, with
      the molecule, route and product type drug_vocabulary assigns it, plus
      how often and over which years the pair appears in claims. Resolution
      is an exact join on both stored strings (ADR-022); a pair the
      vocabulary lacks becomes a null route and fails not_null rather than
      dropping claims.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [generic_name, brand_name]
    columns:
      - name: molecule
        data_tests: [not_null]
      - name: route
        description: Route of administration, the second axis of research question one.
        data_tests: [not_null]
      - name: product_type
        description: drug, or accessory (left out where claims are counted, plan S34).
        data_tests: [not_null]

  - name: int_claims__npi_validated
    description: >
      Every staged CMS claim row with is_npi_valid, the CMS check-digit
      result for the prescriber NPI (macros/luhn_check.sql). Invalid NPIs
      are flagged, never dropped: valid_npi warns on them in staging, and
      the aggregate decides what to count.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_cms__part_d_claims')
    columns:
      - name: is_npi_valid
        data_tests: [not_null]

  - name: int_providers__specialty_grouped
    description: >
      One row per prescriber in the CMS claims, with the NPPES lookup
      outcome, the primary taxonomy, research question one's specialty
      category and research question two's prescriber covariate.
      Prescribers NPPES did not find are 'unknown', an explicit state; a
      found prescriber with an unmapped taxonomy stays null and fails
      not_null, so there is still no default category.
    columns:
      - name: npi
        data_tests: [not_null, unique]
      - name: nppes_found
        description: Null would mean a CMS prescriber was never looked up; not_null catches that.
        data_tests: [not_null]
      - name: specialty_category
        description: Research question one's grouping, plus unknown for prescribers NPPES did not find.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pulmonology, cardiology, advanced_practice, primary_care, pediatrics, unspecified, other, unknown]
      - name: is_pulmonary_disease
        description: >
          Research question two's prescriber covariate: primary taxonomy
          207RP1001X. Narrower than the pulmonology category on purpose; it
          matches generate.py's rule (assert_pulmonary_disease_flag_matches_generator_rule).
        data_tests: [not_null]

  - name: int_providers__history
    description: >
      Provider history (SCD2), one row per version of the tracked
      attributes: nppes_found, taxonomy_code, location_state and
      location_postal_code. Derived from every successful NPPES lookup in
      the landing zone, not captured by a dbt snapshot (ADR-023).
      valid_from is when a version was first observed; valid_to is the next
      version's valid_from, null for the current version. History starts at
      the first lookup (November 2026), so every claim year predates it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [npi, version_number]
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valid_from
            upper_bound_column: "coalesce(valid_to, cast('9999-12-31 00:00:00+00' as timestamp with time zone))"
            partition_by: npi
            gaps: not_allowed
    columns:
      - name: npi
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: nppes_found
        data_tests: [not_null]
