version: 2

models:
  - name: dim_date
    description: >
      One row per calendar day, 2013-01-01 to 2026-12-31. The range is
      fixed; assert_dim_date_covers_every_fact_date fails when a fact date
      falls outside it.
    columns:
      - name: date_day
        description: The calendar day, and the key.
        data_tests: [not_null, unique]

  - name: dim_drug
    description: >
      One row per (generic, brand) pair CMS reports, with the molecule,
      route and product type drug_vocabulary assigns it (ADR-022). Neither
      string alone is a key: Veletri appears under two generic strings.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [generic_name, brand_name]
    columns:
      - name: drug_key
        description: Surrogate key, a hash of the generic and brand strings.
        data_tests: [not_null, unique]
      - name: molecule
        data_tests: [not_null]
      - name: route
        data_tests: [not_null]
      - name: product_type
        description: drug, or accessory (left out where claims are counted, plan S34).
        data_tests: [not_null]

  - name: dim_provider
    description: >
      Provider dimension, SCD2: one row per version from
      int_providers__history (ADR-023), with specialty_category and
      is_pulmonary_disease resolved per version. Facts join on
      effective_from and effective_to, which cover all time for every
      provider; valid_from and valid_to keep what was observed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [npi, version_number]
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: effective_from
            upper_bound_column: effective_to
            partition_by: npi
            gaps: not_allowed
    columns:
      - name: provider_key
        description: Surrogate key for the version, a hash of npi and version_number.
        data_tests: [not_null, unique]
      - name: npi
        data_tests: [not_null]
      - name: nppes_found
        data_tests: [not_null]
      - name: specialty_category
        description: Research question one's grouping for this version; unknown when NPPES did not find the NPI.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pulmonology, cardiology, advanced_practice, primary_care, pediatrics, unspecified, other, unknown]
      - name: is_pulmonary_disease
        description: Research question two's covariate for this version, primary taxonomy 207RP1001X.
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
      - name: effective_from
        data_tests: [not_null]
      - name: effective_to
        data_tests: [not_null]

  - name: fct_claims
    description: >
      Claims fact: one row per prescriber, generic, brand and data year, as
      CMS reports it. Incremental by release year with delete+insert
      (ADR-024): a year loads only when staging holds a new batch for it,
      and then replaces the year whole. provider_key is the dim_provider
      version in effect on data_year_end, the last day of the data year;
      is_provider_backfilled says that version was first observed after
      it. assert_fct_claims_matches_staging holds the fact to staging row
      for row.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [prescriber_npi, generic_name, brand_name, data_year]
    columns:
      - name: claim_key
        description: Surrogate key, a hash of the grain.
        data_tests: [not_null, unique]
      - name: provider_key
        description: The dim_provider version in effect on data_year_end.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_key
      - name: drug_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: data_year_end
        description: The last day of the data year, the date the provider is joined as at.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_npi_valid
        data_tests: [not_null]
      - name: is_provider_backfilled
        description: True when the joined provider version was first observed after data_year_end (ADR-023).
        data_tests: [not_null]
      - name: _batch_id
        description: The landed CMS batch the row came from; the incremental load compares it with staging.
        data_tests: [not_null]
      - name: _loaded_at
        description: When the row's release year last loaded (dbt's run_started_at).
        data_tests: [not_null]
