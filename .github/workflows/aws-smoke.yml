name: aws-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# id-token: write is what lets the job request an OIDC token.
permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::036999274035:role/pah-platform-github-actions
          aws-region: us-east-1

      # s3api rather than `aws s3 ls`: the latter exits 1 on an empty listing,
      # so it cannot tell "no objects" from "no access".
      - name: Prove the role works
        run: |
          aws sts get-caller-identity
          aws s3api list-objects-v2 \
            --bucket pah-platform-landing-036999274035 \
            --prefix landing/ \
            --max-items 10
