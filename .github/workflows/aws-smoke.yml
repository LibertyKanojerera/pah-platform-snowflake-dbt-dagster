name: aws-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# id-token: write is what lets the job request an OIDC token.
# Without it the credentials step fails with a confusing 400.
permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import sys, base64, json
          p = sys.stdin.read().strip()
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ('sub','aud','repository','ref','event_name','workflow_ref')}, indent=2))
          "

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::036999274035:role/pah-platform-github-actions
          aws-region: us-east-1

      - name: Prove the role works
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://pah-platform-landing-036999274035/landing/
