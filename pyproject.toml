[project]
name = "pah-platform-snowflake-dbt-dagster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Libert Kanojerera", email = "kanojerera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer<3.0.0",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dbt-snowflake>=1.12.1",
    "duckdb>=1.5.5",
    "urllib3<2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]
