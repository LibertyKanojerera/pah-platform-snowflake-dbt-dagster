[project]
name = "pah-platform-snowflake-dbt-dagster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Libert Kanojerera", email = "kanojerera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.101",
    "charset-normalizer<3.0.0",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dbt-snowflake>=1.12.1",
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "urllib3<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["ingest", "orchestrate"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "boto3-stubs[s3]>=1.43.123",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
    "types-requests>=2.31.0.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live CMS API and real S3; excluded by default",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[project.scripts]
pah-ingest = "ingest.cli:main"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
